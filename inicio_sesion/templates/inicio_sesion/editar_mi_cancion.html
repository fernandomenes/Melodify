{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar mi canción • Melodify</title>
  <link rel="stylesheet" href="{% static 'inicio_sesion/GlobalStyles.css' %}">
  <link rel="stylesheet" href="{% static 'inicio_sesion/ComponentStyles.css' %}">
  <style>
    :root{--bg:#121212;--card:#1e1e1e;--line:#2b2b2b;--muted:#9aa0a6}
    body{background:#121212;color:#eee}
    .page{max-width:900px;margin:0 auto;padding:24px}
    .hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid #333;background:#1a1a1a;color:#fff}
    .icon-btn:hover{background:#222}
    .card{background:#1e1e1e;border:1px solid #2b2b2b;border-radius:12px;padding:16px}
    label{display:block;margin:10px 0 6px;font-size:14px;color:#bbb}
input[type="text"], input[type="file"], select{width:100%;max-width:520px;padding:10px;border-radius:8px;border:1px solid #333;background:#191919;color:#eee}
    .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
    .cover{width:160px;height:160px;border-radius:10px;background:#2a2a2a;object-fit:cover}
    .muted{color:var(--muted);font-size:12px}
    .messages{list-style:none;padding:0;margin:0 0 12px}
    .messages li{background:#222;border:1px solid #333;padding:8px 10px;border-radius:8px;margin:6px 0}
    .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .btn{padding:10px 14px;border-radius:8px;border:1px solid #3a3a3a;background:#2a2a2a;color:#eee;text-decoration:none;cursor:pointer}
    .btn:hover{background:#333}
  </style>
</head>
<body>
  <div class="page">
    <header class="hdr">
      <a class="icon-btn" href="{% url 'mi_muro' %}" aria-label="Volver a Mi Música" title="Volver a Mi Música">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h2 style="margin:0">Editar mi canción</h2>
    </header>

    <div class="card">
      {% if messages %}
        <ul class="messages">
          {% for m in messages %}<li>{{ m }}</li>{% endfor %}
        </ul>
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">
          <div>
            <label for="title">Título</label>
            <input id="title" name="title" type="text" required value="{{ song.title }}">

            <label for="artist_display_name">Autor / Intérprete</label>
            <input id="artist_display_name" name="artist_display_name" type="text" required value="{{ song.artist_display_name }}">
            <label for="genre">Género</label>
<select id="genre" name="genre" required>
  <option value="" disabled {% if not song.genre %}selected{% endif %}>Selecciona un género…</option>
  <option value="pop"         {% if song.genre == 'pop' %}selected{% endif %}>Pop</option>
  <option value="rock"        {% if song.genre == 'rock' %}selected{% endif %}>Rock</option>
  <option value="electronica" {% if song.genre == 'electronica' %}selected{% endif %}>Electrónica</option>
  <option value="salsa"       {% if song.genre == 'salsa' %}selected{% endif %}>Salsa</option>
  <option value="indie"       {% if song.genre == 'indie' %}selected{% endif %}>Indie</option>
  <option value="hiphop"      {% if song.genre == 'hiphop' %}selected{% endif %}>Hip-Hop</option>
  <option value="reggaeton"   {% if song.genre == 'reggaeton' %}selected{% endif %}>Reggaetón</option>
  <option value="regional"    {% if song.genre == 'regional' %}selected{% endif %}>Regional Mexicano</option>
  <option value="balada"      {% if song.genre == 'balada' %}selected{% endif %}>Balada</option>
  <option value="jazz"        {% if song.genre == 'jazz' %}selected{% endif %}>Jazz</option>
  <option value="clasica"     {% if song.genre == 'clasica' %}selected{% endif %}>Clásica</option>
  <option value="otro"        {% if song.genre == 'otro' %}selected{% endif %}>Otro</option>
</select>

            <div class="btns">
              <button class="btn" type="submit">Guardar cambios</button>
              <a class="btn" href="{% url 'mi_muro' %}">Cancelar</a>
            </div>
          </div>

          <div>
            <label>Portada actual</label>
            {% if song.cover_image %}
              <img class="cover" src="{{ song.cover_image.url }}" alt="Portada">
              <div style="margin-top:8px">
                <label class="muted"><input type="checkbox" name="remove_cover" value="1"> Quitar portada</label>
              </div>
            {% else %}
              <div class="cover"></div>
              <p class="muted" style="margin:6px 0 0">Sin portada</p>
            {% endif %}

            <label style="margin-top:10px" for="cover_image">Cambiar portada</label>
            <input id="cover_image" name="cover_image" type="file" accept=".png,.jpg,.jpeg,.webp">
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
