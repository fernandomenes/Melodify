{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"> 
    <link rel="stylesheet"  href="{% static 'inicio_sesion/GlobalStyles.css' %}">
    <link rel="stylesheet"  href="{% static 'inicio_sesion/ComponentStyles.css' %}">

</head>
<body>

    <div class="logo-container">
        <img src="{% static 'inicio_sesion/logo.png' %}" alt="Melodify Logo" class="logo-image">
        <span class="logo-text">Melodify</span>
    </div>

    <div class="loginContainer">
        <h2>Iniciar Sesión</h2>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

    
         <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="user">Usuario:</label>
            <input type="text" id="user" name="user" required placeholder="user" ><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Password" ><br><br>

            <button type="submit" class="btnRound">Entrar</button>
        </form>
        
    </div>
</body>
</html>
