{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Melodify</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet"  href="{% static 'inicio_sesion/GlobalStyles.css' %}">
    <link rel="stylesheet"  href="{% static 'inicio_sesion/ComponentStyles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>
    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
    }

    .password-wrapper input {
        width: 100%;
        padding-right: 40px;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        cursor: pointer;
        font-size: 20px;
        color: #aaa;
        transition: color 0.2s;
    }

    .toggle-password:hover {
        color: white;
    }
    </style>

</head>
<body>

    <div class="logo-container">
        <img src="{% static 'inicio_sesion/logo.png' %}" alt="Melodify Logo" class="logo-image">
        <span class="logo-text">Melodify</span>
    </div>

    <div class="loginContainer">
        <h2>Iniciar Sesión</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags %}{{ message.tags }}{% endif %}" 
                    style="color: {% if message.tags == 'success' %}#4CAF50{% else %}#f44336{% endif %}; 
                    padding: 10px; margin: 10px 0; border-radius: 5px; 
                    background: {% if message.tags == 'success' %}#e8f5e8{% else %}#ffebee{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="user">Usuario:</label>
            <input type="text" id="user" name="user" required placeholder="user" ><br><br>

            <label for="password">Contraseña:</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required placeholder="Password">
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>
            <br>

            <button type="submit" class="btnRound">Entrar</button>
        </form>

    </div>

    <script>
    // Mostrar/ocultar contraseña
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";

        togglePassword.classList.toggle("fa-eye");
        togglePassword.classList.toggle("fa-eye-slash");
    });
    </script>

</body>
</html>
