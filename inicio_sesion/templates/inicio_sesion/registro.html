{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Melodify</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inicio_sesion/GlobalStyles.css' %}">
    <link rel="stylesheet" href="{% static 'inicio_sesion/ComponentStyles.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
            color: #aaa;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: white;
        }
    </style>

</head>
<body>

    <div class="logo-container">
        <img src="{% static 'inicio_sesion/logo.png' %}" alt="Melodify Logo" class="logo-image">
        <span class="logo-text">Melodify</span>
    </div>

    <div class="loginContainer">
        <h2>Crear Cuenta</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags %}{{ message.tags }}{% endif %}"
                     style="color: {% if message.tags == 'success' %}#4CAF50{% else %}#f44336{% endif %};
                            padding: 10px; margin: 10px 0; border-radius: 5px;
                            background: {% if message.tags == 'success' %}#e8f5e8{% else %}#ffebee{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'registro' %}">
            {% csrf_token %}

            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" name="username" required placeholder="Ingresa tu nombre de usuario">

            <label for="password">Contraseña:</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                <i class="fa-solid fa-eye toggle-password" id="togglePass1"></i>
            </div>

            <label for="confirm_password">Confirmar contraseña:</label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repite tu contraseña">
                <i class="fa-solid fa-eye toggle-password" id="togglePass2"></i>
            </div>

            <button type="submit" class="btnRound">Registrarse</button>
        </form>

        <p style="margin-top: 20px; text-align: center;">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: #ff0066;">Inicia sesión aquí</a>
        </p>
    </div>

    <script>
        // Mostrar/ocultar contraseña
        const toggle1 = document.getElementById("togglePass1");
        const toggle2 = document.getElementById("togglePass2");
        const pass1 = document.getElementById("password");
        const pass2 = document.getElementById("confirm_password");

        toggle1.addEventListener("click", () => {
            const hidden = pass1.type === "password";
            pass1.type = hidden ? "text" : "password";
            toggle1.classList.toggle("fa-eye");
            toggle1.classList.toggle("fa-eye-slash");
        });

        toggle2.addEventListener("click", () => {
            const hidden = pass2.type === "password";
            pass2.type = hidden ? "text" : "password";
            toggle2.classList.toggle("fa-eye");
            toggle2.classList.toggle("fa-eye-slash");
        });

        // Validación del formulario
        document.querySelector('form').addEventListener('submit', function(e) {
            if (pass1.value !== pass2.value) {
                e.preventDefault();
                alert('Las contraseñas no coinciden. Por favor, verifica.');
                return false;
            }

            if (pass1.value.length < 6) {
                e.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres.');
                return false;
            }
        });
    </script>

</body>
</html>
