{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melodify</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <!-- Estilos generales de la app -->
  <link rel="stylesheet" href="{% static 'inicio_sesion/homeStyle.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="{% static 'inicio_sesion/ComponentStyles.css' %}?v={% now 'U' %}">

  <!-- Reproductor (módulo en app reproductor) -->
  <link rel="stylesheet" href="{% static 'reproductor/reproductor.css' %}?v={% now 'U' %}">

  <script>
    /* Ruta del módulo JS del reproductor para import dinámico en homeScript.js */
    window.REPRODUCTOR_SRC = "{% static 'reproductor/reproductor.js' %}?v={% now 'U' %}";
  </script>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <div class="user-info" id="user-trigger">
      <div class="user-icon">U</div>
      <span id="username">Usuario</span>
      <div id="user-menu">
        <a href="#" id="menu-perfil">Perfil</a>
        <a href="#" id="menu-logout" data-logout-url="{% url 'logout' %}">Cerrar sesión</a>
      </div>
    </div>
  </div>

  <!-- Menú lateral -->
  <div id="menuLateral">
    <div class="logo" id="toggle-menu">
      <img src="{% static 'inicio_sesion/logo.png' %}" alt="Melodify Logo" class="logo-image">
      <span class="logo-text">Melodify</span>
    </div>

    <!-- Home: manejada también por la SPA -->
    <a class="menu-item" data-view="home" href="{% url 'home' %}">Home</a>

    <!-- Vistas internas de la SPA (las renderiza homeScript.js) -->
    <div class="menu-item" data-view="playlist">PlayList</div>
    <div class="menu-item" data-view="reproductor">Reproductor</div>
    <div class="menu-item" data-view="perfil">Perfil</div>

    <!-- OJO: SIN “Gestión” en el sidebar -->
  </div>

  <!-- Contenido -->
  <div id="main-content"
       data-initial-view="home"
       data-username="{{ session_user }}"
       data-role="{{ session_role }}"
       data-avatar="{{ session_avatar_url }}"
       data-description="{{ session_description }}"
       data-created-at="{{ session_created_at }}"
       data-url-home="{% url 'home' %}"
       data-url-musica="/musica/"
       data-url-mi-muro="{% url 'mi_muro' %}"
       data-url-gestion="{% url 'gestion' %}"
       data-url-revertir="{% url 'revertir' %}"
       data-url-mi-musica-json="{% url 'mi_musica_json' %}">

    <button id="menu-toggle-btn">☰</button>

    <!-- Botón Back universal (se oculta en Home por CSS) -->
    <a id="back-btn" class="back" href="{% url 'home' %}"
       title="Volver a inicio" aria-label="Regresar">←</a>

    <!-- Contenedor SPA -->
    <div id="content"></div>
  </div>

  <!-- Playlists para el reproductor (inyectado desde views.py) -->
  <script id="playlists-data-json" type="application/json">
    {{ playlists_json|default:"[]"|safe }}
  </script>

  <!-- SPA principal -->
  <script type="module" src="{% static 'inicio_sesion/homeScript.js' %}?v={% now 'U' %}"></script>

  <!-- Logout (POST con CSRF) -->
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const logoutLink = document.getElementById('menu-logout');
    const logoutUrl = "{% url 'logout' %}";
    if (logoutLink) {
      logoutLink.addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('¿Seguro que deseas cerrar sesión?')) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = logoutUrl;

          const csrfInput = document.createElement('input');
          csrfInput.type = 'hidden';
          csrfInput.name = 'csrfmiddlewaretoken';
          csrfInput.value = '{{ csrf_token }}';
          form.appendChild(csrfInput);

          document.body.appendChild(form);
          form.submit();
        }
        const userMenu = document.getElementById('user-menu');
        if (userMenu) userMenu.classList.remove('show');
      });
    }
  });

  /* Anti-cache al volver atrás después de logout */
  document.addEventListener('DOMContentLoaded', function() {
    if (performance.navigation && performance.navigation.type === 2) {
      window.location.href = "{% url 'home' %}";
    }
    window.onpageshow = function(ev){ if (ev.persisted) window.location.reload(); };
  });
  if (window.history.replaceState) { window.history.replaceState(null, null, window.location.href); }
  </script>
</body>
</html>
