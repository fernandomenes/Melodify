{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melodify</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <!-- Estilos generales -->
  <link rel="stylesheet" href="{% static 'inicio_sesion/homeStyle.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="{% static 'inicio_sesion/ComponentStyles.css' %}?v={% now 'U' %}">

  <!-- Reproductor (CSS): reproductor primero, barra UI al final para sobrescribir -->
  <link rel="stylesheet" href="{% static 'reproductor/reproductor.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="{% static 'reproductor/barra_reproduccion.css' %}?v={% now 'U' %}">

  <script>
    /* Ruta del módulo JS del reproductor — el homeScript usa import dinámico */
    window.REPRODUCTOR_SRC = "{% static 'reproductor/reproductor.js' %}?v={% now 'U' %}";
  </script>

  <!-- (Opcional) playlists UI propia -->
  <script src="{% static 'inicio_sesion/playListScript.js' %}"></script>
  <link rel="stylesheet" href="{% static 'inicio_sesion/PlayListStyles.css' %}">
</head>

<body class="page-home">
  <!-- Header -->
  <div id="header">
    <!-- Buscador centrado -->
    <div id="search" class="search">
      <form id="search-form" role="search" aria-label="Buscar" method="get" action="{% url 'buscar' %}">
        <input
            id="search-input"
            name="q"
            type="search"
            placeholder="Buscar canciones, artistas o playlists…"
            autocomplete="off"
            aria-controls="search-panel"
            required />
      </form>
      <div id="search-panel" class="search-panel" hidden></div>
    </div>

    <!-- Usuario -->
    <div class="user-info" id="user-trigger">
      <div class="user-icon">U</div>
      <span id="username">Usuario</span>
      <div id="user-menu">
        <a href="#" id="menu-perfil">Perfil</a>
        <a href="#" id="menu-logout" data-logout-url="{% url 'logout' %}">Cerrar sesión</a>
      </div>
    </div>
  </div>

  <!-- Menú lateral -->
  <div id="menuLateral">
    <div class="logo" id="toggle-menu">
      <img src="{% static 'inicio_sesion/logo.png' %}" alt="Melodify Logo" class="logo-image">
      <span class="logo-text">Melodify</span>
    </div>

    <!-- Home (ruta real) -->
    <a class="menu-item" data-view="home" href="{% url 'home' %}">Home</a>

    <!-- Vistas internas del SPA (las renderiza homeScript.js) -->
    <div class="menu-item" data-view="playlist">PlayList</div>
    <div class="menu-item" data-view="reproductor">Reproductor</div>
    <div class="menu-item" data-view="perfil">Perfil</div>

    <!-- Vistas de servidor (navegación) -->
    <div class="menu-item" data-view="mi-muro">Muro del artista</div>
    <div class="menu-item" data-view="gestion">Gestión</div>
  </div>

  <!-- Contenido -->
  <div id="main-content"
       data-initial-view="home"
       data-username="{{ session_user }}"
       data-role="{{ session_role }}"
       data-avatar="{{ session_avatar_url }}"
       data-description="{{ session_description }}"
       data-created-at="{{ session_created_at }}"
       data-url-home="{% url 'home' %}"
       data-url-musica="/musica/"
       data-url-mi-muro="{% url 'mi_muro' %}"
       data-url-gestion="{% url 'gestion' %}"
       data-url-revertir="{% url 'revertir' %}"
       data-url-mi-musica-json="{% url 'mi_musica_json' %}">

    <button id="menu-toggle-btn">☰</button>

    <!-- Botón Back universal (lo maneja la SPA; oculto en Home por CSS) -->
    <a id="back-btn" class="back" href="{% url 'home' %}" title="Volver a inicio" aria-label="Regresar">←</a>

    <div id="content"></div>
  </div>

  <!-- Playlists para el reproductor (inyectadas desde views.py cuando aplique) -->
  <script id="playlists-data-json" type="application/json">
    {{ playlists_json|default:"[]"|safe }}
  </script>

  <!-- Scripts (en orden): barra UI → SPA -->
  <script defer src="{% static 'reproductor/barra_reproduccion.js' %}?v={% now 'U' %}"></script>
  <script type="module" src="{% static 'inicio_sesion/homeScript.js' %}?v={% now 'U' %}"></script>

  <!-- Logout (POST con CSRF) + anti-cache -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const logoutLink = document.getElementById('menu-logout');
      const logoutUrl  = "{% url 'logout' %}";
      if (logoutLink) {
        logoutLink.addEventListener('click', function(e) {
          e.preventDefault();
          if (confirm('¿Seguro que deseas cerrar sesión?')) {
            const form  = document.createElement('form');
            form.method = 'POST';
            form.action = logoutUrl;

            const csrfInput = document.createElement('input');
            csrfInput.type  = 'hidden';
            csrfInput.name  = 'csrfmiddlewaretoken';
            csrfInput.value = '{{ csrf_token }}';
            form.appendChild(csrfInput);

            document.body.appendChild(form);
            form.submit();
          }
          const userMenu = document.getElementById('user-menu');
          if (userMenu) userMenu.classList.remove('show');
        });
      }

      // Prevenir navegación hacia atrás en cache tras logout
      if (performance.navigation && performance.navigation.type === 2) {
        window.location.href = "{% url 'home' %}";
      }
      window.onpageshow = function(ev){ if (ev.persisted) window.location.reload(); };

      // Evitar re-envío de formularios al refrescar
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
      }
    });
  </script>

  <!-- Script para manejo de búsqueda -->
  <script src="{% static 'inicio_sesion/searchHandler.js' %}?v={% now 'U' %}"></script>
</body>
</html>
