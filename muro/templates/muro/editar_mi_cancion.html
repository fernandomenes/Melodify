{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar mi canción • Melodify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="{% static 'inicio_sesion/GlobalStyles.css' %}">
  <link rel="stylesheet" href="{% static 'inicio_sesion/ComponentStyles.css' %}">
  <style>
    :root{
      --bg:#121212; --card:#1e1e1e; --line:#2b2b2b; --muted:#9aa0a6;
      --btn:#2a2a2a; --btnb:#3a3a3a;
    }
    *{box-sizing:border-box}
    body{background:#121212;color:#eee;margin:0}
    .page{max-width:960px;margin:0 auto;padding:24px}

    header.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid #333;background:#1a1a1a;color:#fff;text-decoration:none}
    .icon-btn:hover{background:#222}

    .card{background:#1e1e1e;border:1px solid #2b2b2b;border-radius:12px;padding:16px}

    /* ===== layout uniforme ===== */
    .form-grid{
      display:grid;
      grid-template-columns: minmax(280px, 1fr) 220px;
      gap:20px;
      align-items:start;
    }
    @media (max-width: 820px){
      .form-grid{grid-template-columns: 1fr}
    }

    .field{margin:10px 0}
    .field label{display:block;margin:0 0 6px;font-size:14px;color:#bbb}
    .textlike, select, input[type="file"]{
      width:100%; padding:10px; border-radius:8px; border:1px solid #333;
      background:#191919; color:#eee; max-width:520px;
    }
    .help{color:var(--muted); font-size:12px}

    .btn{padding:10px 14px;border-radius:8px;border:1px solid #3a3a3a;background:#2a2a2a;color:#eee;text-decoration:none;cursor:pointer}
    .btn:hover{background:#333}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

    /* portada */
    .cover-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
    .cover{width:200px;height:200px;border-radius:12px;background:#2a2a2a;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
    .cover.ph{display:flex;align-items:center;justify-content:center;color:#bbb}
  </style>
</head>
<body>
  <div class="page">
    <header class="hdr">
      <a class="icon-btn" href="{% url 'mi_muro' %}" aria-label="Volver a Mi Música" title="Volver a Mi Música">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <h2 style="margin:0">Editar mi canción</h2>
    </header>

    <div class="card">
      <!-- OJO: sin mensajes flash aquí -->
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">
          <!-- Columna izquierda -->
          <div>
            <div class="field">
              <label for="title">Título</label>
              <input id="title" name="title" type="text" class="textlike" required value="{{ song.title }}">
            </div>

            <div class="field">
              <label for="artist_display_name">Autor / Intérprete</label>
              <input id="artist_display_name" name="artist_display_name" type="text" class="textlike" required value="{{ song.artist_display_name }}">
            </div>

            <div class="field">
              <label for="genre">Género</label>
              <select id="genre" name="genre" required>
                <option value="" disabled {% if not song.genre %}selected{% endif %}>Selecciona un género…</option>
                <option value="pop" {% if song.genre == 'pop' %}selected{% endif %}>Pop</option>
                <option value="rock" {% if song.genre == 'rock' %}selected{% endif %}>Rock</option>
                <option value="electronica" {% if song.genre == 'electronica' %}selected{% endif %}>Electrónica</option>
                <option value="salsa" {% if song.genre == 'salsa' %}selected{% endif %}>Salsa</option>
                <option value="indie" {% if song.genre == 'indie' %}selected{% endif %}>Indie</option>
                <option value="hiphop" {% if song.genre == 'hiphop' %}selected{% endif %}>Hip-Hop</option>
                <option value="reggaeton" {% if song.genre == 'reggaeton' %}selected{% endif %}>Reggaetón</option>
                <option value="regional" {% if song.genre == 'regional' %}selected{% endif %}>Regional Mexicano</option>
                <option value="balada" {% if song.genre == 'balada' %}selected{% endif %}>Balada</option>
                <option value="jazz" {% if song.genre == 'jazz' %}selected{% endif %}>Jazz</option>
                <option value="clasica" {% if song.genre == 'clasica' %}selected{% endif %}>Clásica</option>
                <option value="otro" {% if song.genre == 'otro' %}selected{% endif %}>Otro</option>
              </select>
            </div>

            <div class="btns">
              <button class="btn" type="submit">Guardar cambios</button>
              <a class="btn" href="{% url 'mi_muro' %}">Cancelar</a>
            </div>
          </div>

          <!-- Columna derecha: portada -->
          <div class="cover-side">
            <label>Portada actual</label>
            {% if song.cover_image %}
              <img class="cover" src="{{ song.cover_image.url }}" alt="Portada">
            {% else %}
              <div class="cover ph">Sin portada</div>
            {% endif %}

            <div class="field" style="margin-top:4px">
              <label for="cover_image">Cambiar portada</label>
              <input id="cover_image" name="cover_image" type="file" accept=".png,.jpg,.jpeg,.webp">
              <div class="field" style="margin-top:8px">
                <label class="help"><input type="checkbox" name="remove_cover" value="1"> Quitar portada</label>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
